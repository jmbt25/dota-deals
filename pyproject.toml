[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dota-deals"
version = "0.1.0a0"
description = "Buy-signal analytics for the Steam Community Market (Dota 2 arcanas and immortals)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "dota-deals contributors" }]
keywords = ["dota", "steam-market", "analytics", "signals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.35,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.4,<26.0",
    "tenacity>=9.0,<10.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]>=1.35,<2.0",
    "freezegun>=1.5,<2.0",
    "moto[s3]>=5.0,<6.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
]

[project.urls]
Repository = "https://github.com/RsdNoob/dota-deals"

[project.scripts]
dota-deals = "dota_deals.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dota_deals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "ASYNC",  # async-specific
    "PIE",    # misc bugs
    "RUF",    # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Test files use fixtures whose return types Pydantic models don't always express well.
# Keep strict for src/, relax just the implicit-reexport rule for tests.
module = "tests.*"
implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
]
