name: deploy-frontend

# Cloudflare Pages deploy for the frontend (static + Pages Functions).
# Two triggers:
#
#  - ``push`` to main, gated by a paths filter so only changes that
#    actually affect the deploy artifact fire it. Documentation,
#    Python pipeline, and tests don't ship to the edge, so editing
#    them doesn't burn a build.
#  - ``workflow_dispatch`` for manual runs (Actions tab → deploy-
#    frontend → "Run workflow", or ``gh workflow run
#    deploy-frontend.yml``). Useful as a fallback when a previous
#    deploy attempt failed mid-upload (the Phase 12 Manila-edge
#    outage was the original trigger for adding this workflow).
#
# Phase 13 promoted this from manual-only to the primary deploy
# path: ``npm run deploy`` from an operator shell is still
# supported as a fallback, but pushing to main is now the canonical
# trigger.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# No git writes, no PR comments — only network egress to Cloudflare's
# API. Pages Functions and static assets get uploaded; nothing in this
# repo changes.
permissions:
  contents: read

# A push that lands while another deploy is mid-flight should win:
# the new artifact is what ``main`` reflects now, so the older
# upload should be cancelled. (Distinct from the ``pipeline``
# group used by ``.github/workflows/pipeline.yml``, which has the
# opposite policy — pipeline runs can't be cancelled mid-write.)
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  # Read by wrangler. CLOUDFLARE_API_TOKEN was extended with
  # `Cloudflare Pages: Edit` scope in Phase 11; CLOUDFLARE_ACCOUNT_ID
  # is required so wrangler doesn't fall back to `/memberships`
  # (which the token's scope can't read — see Phase 10's
  # 37bc3bb diagnostic).
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        # Uses package-lock.json for a reproducible install. The only
        # production dep wrangler needs is itself + hono; everything
        # else is devDependencies pulled for completeness.
        run: npm ci

      - name: Deploy to Cloudflare Pages
        # `public` is the static-asset dir (per pages_build_output_dir
        # in wrangler.toml); `functions/` is auto-discovered from the
        # project root. `--branch=main` pins the production lane so
        # the deploy lands on the `*.pages.dev` canonical URL, not a
        # preview subdomain. Passing `.` here trips the 25-MiB-per-file
        # cap on dev-cache directories — see docs/DEPLOYMENT.md
        # "Lessons from Phase 11 deploy" entry 2.
        run: npx wrangler pages deploy public --project-name=dota-deals --branch=main
