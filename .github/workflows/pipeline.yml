name: pipeline

# Scheduled pipeline: ingest 3x/day, full late-day compute 1x/day (the 16:00
# UTC run). Storage is Cloudflare D1; this workflow no longer syncs SQLite
# to R2 between runs and no longer publishes static JSON to public/data/.
# The frontend at dotadeals.com is intentionally stale during the
# Phase 10 - 12 window (see docs/DEPLOYMENT.md "Known gap" section).

on:
  schedule:
    # Every 8 hours, at the same slots Settings.ingest_cadence_hours rounds
    # to (00:00, 08:00, 16:00 UTC). Cron is in UTC on GHA.
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: "Skip ingest (don't hit Steam). Use to re-run signals/score after a fix."
        type: boolean
        default: false

# The publish step that committed public/data/ back to main is gone in
# Phase 10. Keeping `contents: write` is cheap headroom in case a future
# workflow needs it; Phase 13 cleanup can drop it.
permissions:
  contents: write

# Don't let two scheduled runs overlap. The 8-hour cron and the <5-minute
# typical runtime make collisions unlikely, but a stuck previous job +
# a fresh schedule trigger could otherwise both write to D1 simultaneously.
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  # ---- Cloudflare D1 (read by the dota-deals CLI via pydantic-settings) ----
  # Storage backend. The D1 API token is scoped narrowly to "D1: Edit on
  # this database" — see docs/D1_MIGRATION.md for the token-creation
  # walkthrough.
  CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_D1_DATABASE_ID:  ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
  CLOUDFLARE_D1_API_TOKEN:    ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

  # ---- Cloudflare API token used by wrangler ----
  # Wrangler reads CLOUDFLARE_API_TOKEN from the env, NOT
  # CLOUDFLARE_D1_API_TOKEN. This is a distinct secret with broader
  # scope (D1: Edit + Workers Scripts: Edit) — the Workers permission
  # is unused in Phase 10 but lands now so Phase 11's Worker deploy
  # doesn't need another token-rotation step.
  CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}

  PYTHONUNBUFFERED:           "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cloudflare auth diagnostic
        # TEMPORARY (Phase 10 debug). Surfaces why wrangler is hitting
        # /memberships with a 10000 error. Three checks:
        #
        #  1. Are the env vars actually populated? (length-only — no
        #     value leakage.)
        #  2. Does the token authenticate at all? (/user/tokens/verify
        #     is reachable by any valid token regardless of scope.)
        #  3. Does the token have permission to hit /memberships?
        #     Account-scoped tokens (D1: Edit + Workers Scripts: Edit)
        #     typically don't — that endpoint needs User → User
        #     Details → Read. If wrangler is reaching for /memberships
        #     in the first place, it's because CLOUDFLARE_ACCOUNT_ID
        #     isn't set in the env so it has no account_id to use.
        #
        # Remove this step once we know which of (1)/(2)/(3) was the
        # blocker.
        run: |
          set +e
          echo "## Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN: present (length=${#CLOUDFLARE_API_TOKEN})"
            echo "- \`CLOUDFLARE_API_TOKEN\`: present (length=${#CLOUDFLARE_API_TOKEN})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLOUDFLARE_API_TOKEN: EMPTY/UNSET — this is the bug. Fix: add the secret in repo Settings."
            echo "- \`CLOUDFLARE_API_TOKEN\`: **EMPTY/UNSET** — fix in repo Settings" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID: present (length=${#CLOUDFLARE_ACCOUNT_ID})"
            echo "- \`CLOUDFLARE_ACCOUNT_ID\`: present (length=${#CLOUDFLARE_ACCOUNT_ID})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CLOUDFLARE_ACCOUNT_ID: EMPTY/UNSET — wrangler will fall back to /memberships, which needs User-level scope."
            echo "- \`CLOUDFLARE_ACCOUNT_ID\`: **EMPTY/UNSET** — wrangler will hit /memberships, fix in repo Settings" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo ""
          echo "--- /user/tokens/verify ---"
          # Any valid token can hit this endpoint regardless of scope.
          # 200 = token valid; 401/403 = token is wrong/revoked.
          curl -s -o /tmp/verify.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"
          cat /tmp/verify.json
          echo ""

          echo "--- /memberships ---"
          # User-level endpoint. A token scoped only to "D1: Edit" or
          # "Workers Scripts: Edit" cannot read this; wrangler hits it
          # when no CLOUDFLARE_ACCOUNT_ID is available.
          curl -s -o /tmp/memberships.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/memberships"
          cat /tmp/memberships.json
          echo ""

          echo "--- accounts/.../d1/database (account-scoped probe) ---"
          # Confirms the token CAN access the account's D1 resources
          # even if /memberships is denied.
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            curl -s -o /tmp/d1list.json -w "HTTP %{http_code}\n" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
            cat /tmp/d1list.json
            echo ""
          else
            echo "(skipped — no CLOUDFLARE_ACCOUNT_ID to probe)"
          fi

          # Don't fail the workflow here — let the next step's real
          # error speak. The diagnostic output above is what matters.
          true

      - name: Apply D1 migrations
        # Idempotent: no-op when nothing new is in migrations/. Runs on
        # every invocation (cron and manual) so a freshly-committed
        # migration is applied before the rest of the pipeline runs
        # against the schema it expects. wrangler authenticates via
        # CLOUDFLARE_API_TOKEN (set in the env block above).
        run: npx wrangler d1 migrations apply dota-deals --remote

      - name: Compute run flags
        id: flags
        # Resolve once at job start so every gated step uses the same hour
        # (a long-running job that crosses an hour boundary doesn't flip
        # behavior mid-flight).
        run: |
          set -euo pipefail
          HOUR=$(date -u +%H)
          IS_MANUAL='${{ github.event_name == 'workflow_dispatch' }}'
          SKIP_INGEST='${{ inputs.skip_ingest == true }}'

          # Universe: only the 00:00 UTC scheduled run. Manual dispatch
          # skips it on purpose — the items table is fresh enough from
          # previous scheduled runs, and a manual rerun shouldn't burn
          # Steam quota on universe paging.
          if [ "$HOUR" = "00" ] && [ "$IS_MANUAL" != "true" ]; then
            RUN_UNIVERSE=true
          else
            RUN_UNIVERSE=false
          fi

          # Ingest runs on every scheduled trigger, and on manual dispatch
          # unless skip_ingest=true.
          if [ "$SKIP_INGEST" = "true" ]; then
            RUN_INGEST=false
          else
            RUN_INGEST=true
          fi

          # Late-day stages (signals + score): only the 16:00 UTC
          # scheduled run, OR any manual dispatch (manual is "I want a
          # full compute now").
          if [ "$HOUR" = "16" ] || [ "$IS_MANUAL" = "true" ]; then
            RUN_LATE=true
          else
            RUN_LATE=false
          fi

          {
            echo "hour=$HOUR"
            echo "is_manual=$IS_MANUAL"
            echo "skip_ingest=$SKIP_INGEST"
            echo "run_universe=$RUN_UNIVERSE"
            echo "run_ingest=$RUN_INGEST"
            echo "run_late=$RUN_LATE"
          } >> "$GITHUB_OUTPUT"

          # Echo to the run summary for easier debugging in the GHA UI.
          {
            echo "## Pipeline flags"
            echo "| flag | value |"
            echo "|---|---|"
            echo "| hour | \`$HOUR\` |"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| is_manual | \`$IS_MANUAL\` |"
            echo "| skip_ingest | \`$SKIP_INGEST\` |"
            echo "| run_universe | \`$RUN_UNIVERSE\` |"
            echo "| run_ingest | \`$RUN_INGEST\` |"
            echo "| run_late | \`$RUN_LATE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh universe
        if: steps.flags.outputs.run_universe == 'true'
        run: dota-deals universe refresh

      - name: Generate items.txt from items table
        if: steps.flags.outputs.run_ingest == 'true'
        # Generated dynamically so the ingest list always matches what the
        # universe stage just upserted. Static items.txt would drift.
        run: dota-deals items list-active > /tmp/items.txt && wc -l /tmp/items.txt

      - name: Ingest
        if: steps.flags.outputs.run_ingest == 'true'
        run: dota-deals ingest --items /tmp/items.txt

      - name: Compute signals
        if: steps.flags.outputs.run_late == 'true'
        run: dota-deals signals compute

      - name: Score
        if: steps.flags.outputs.run_late == 'true'
        run: dota-deals score
