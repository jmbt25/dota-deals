name: pipeline

# Scheduled pipeline: ingest 3x/day, full late-day compute 1x/day (the 16:00
# UTC run). Storage is Cloudflare D1; this workflow no longer syncs SQLite
# to R2 between runs and no longer publishes static JSON to public/data/.
# The frontend at dotadeals.com is intentionally stale during the
# Phase 10 - 12 window (see docs/DEPLOYMENT.md "Known gap" section).

on:
  schedule:
    # Every 8 hours, at the same slots Settings.ingest_cadence_hours rounds
    # to (00:00, 08:00, 16:00 UTC). Cron is in UTC on GHA.
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: "Skip ingest (don't hit Steam). Use to re-run signals/score after a fix."
        type: boolean
        default: false

# The publish step that committed public/data/ back to main is gone in
# Phase 10. Keeping `contents: write` is cheap headroom in case a future
# workflow needs it; Phase 13 cleanup can drop it.
permissions:
  contents: write

# Don't let two scheduled runs overlap. The 8-hour cron and the <5-minute
# typical runtime make collisions unlikely, but a stuck previous job +
# a fresh schedule trigger could otherwise both write to D1 simultaneously.
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  # ---- Cloudflare D1 (read by the dota-deals CLI via pydantic-settings) ----
  # Storage backend. The D1 API token is scoped narrowly to "D1: Edit on
  # this database" — see docs/D1_MIGRATION.md for the token-creation
  # walkthrough.
  CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_D1_DATABASE_ID:  ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
  CLOUDFLARE_D1_API_TOKEN:    ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

  # ---- Cloudflare API token used by wrangler ----
  # Wrangler reads CLOUDFLARE_API_TOKEN from the env, NOT
  # CLOUDFLARE_D1_API_TOKEN. This is a distinct secret with broader
  # scope (D1: Edit + Workers Scripts: Edit) — the Workers permission
  # is unused in Phase 10 but lands now so Phase 11's Worker deploy
  # doesn't need another token-rotation step.
  CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}

  PYTHONUNBUFFERED:           "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply D1 migrations
        # Idempotent: no-op when nothing new is in migrations/. Runs on
        # every invocation (cron and manual) so a freshly-committed
        # migration is applied before the rest of the pipeline runs
        # against the schema it expects.
        #
        # wrangler authenticates via ``CLOUDFLARE_API_TOKEN`` and reads
        # ``CLOUDFLARE_ACCOUNT_ID`` from env. Both must be populated as
        # repo secrets — if ``CLOUDFLARE_ACCOUNT_ID`` is unset, wrangler
        # falls back to ``/memberships`` to discover the account, and
        # that user-level endpoint is denied to an account-scoped token
        # (``D1: Edit`` + ``Workers Scripts: Edit``), failing with
        # ``Authentication error [code: 10000]``. The diagnostic step
        # that surfaced this on first deploy lived here through commit
        # 37bc3bb and was removed once the cause was known.
        run: npx wrangler d1 migrations apply dota-deals --remote

      - name: Compute run flags
        id: flags
        # Resolve once at job start so every gated step uses the same hour
        # (a long-running job that crosses an hour boundary doesn't flip
        # behavior mid-flight).
        run: |
          set -euo pipefail
          HOUR=$(date -u +%H)
          IS_MANUAL='${{ github.event_name == 'workflow_dispatch' }}'
          SKIP_INGEST='${{ inputs.skip_ingest == true }}'

          # Universe: only the 00:00 UTC scheduled run. Manual dispatch
          # skips it on purpose — the items table is fresh enough from
          # previous scheduled runs, and a manual rerun shouldn't burn
          # Steam quota on universe paging.
          if [ "$HOUR" = "00" ] && [ "$IS_MANUAL" != "true" ]; then
            RUN_UNIVERSE=true
          else
            RUN_UNIVERSE=false
          fi

          # Ingest runs on every scheduled trigger, and on manual dispatch
          # unless skip_ingest=true.
          if [ "$SKIP_INGEST" = "true" ]; then
            RUN_INGEST=false
          else
            RUN_INGEST=true
          fi

          # Late-day stages (signals + score): only the 16:00 UTC
          # scheduled run, OR any manual dispatch (manual is "I want a
          # full compute now").
          if [ "$HOUR" = "16" ] || [ "$IS_MANUAL" = "true" ]; then
            RUN_LATE=true
          else
            RUN_LATE=false
          fi

          {
            echo "hour=$HOUR"
            echo "is_manual=$IS_MANUAL"
            echo "skip_ingest=$SKIP_INGEST"
            echo "run_universe=$RUN_UNIVERSE"
            echo "run_ingest=$RUN_INGEST"
            echo "run_late=$RUN_LATE"
          } >> "$GITHUB_OUTPUT"

          # Echo to the run summary for easier debugging in the GHA UI.
          {
            echo "## Pipeline flags"
            echo "| flag | value |"
            echo "|---|---|"
            echo "| hour | \`$HOUR\` |"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| is_manual | \`$IS_MANUAL\` |"
            echo "| skip_ingest | \`$SKIP_INGEST\` |"
            echo "| run_universe | \`$RUN_UNIVERSE\` |"
            echo "| run_ingest | \`$RUN_INGEST\` |"
            echo "| run_late | \`$RUN_LATE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh universe
        if: steps.flags.outputs.run_universe == 'true'
        run: dota-deals universe refresh

      - name: Generate items.txt from items table
        if: steps.flags.outputs.run_ingest == 'true'
        # Generated dynamically so the ingest list always matches what the
        # universe stage just upserted. Static items.txt would drift.
        run: dota-deals items list-active > /tmp/items.txt && wc -l /tmp/items.txt

      - name: Ingest
        if: steps.flags.outputs.run_ingest == 'true'
        run: dota-deals ingest --items /tmp/items.txt

      - name: Compute signals
        if: steps.flags.outputs.run_late == 'true'
        run: dota-deals signals compute

      - name: Score
        if: steps.flags.outputs.run_late == 'true'
        run: dota-deals score
